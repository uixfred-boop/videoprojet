<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Creative Design Engineer</title>
  <meta name="description" content="Portfolio — design, motion et développement web.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero__meta">
        <p class="hero__role" data-hero-fade data-site-role></p>
        <p class="hero__scroll mono muted" data-hero-fade>(Scroll) ↓</p>
        <p class="hero__intro" data-hero-fade data-site-intro></p>
      </div>
      <h1 class="hero__title" data-hero-title></h1>
    </section>

    <!-- Showreel -->
    <section class="reel">
      <div class="reel__frame" data-cursor="Play">
        <span class="reel__label mono"></span>
        <span class="reel__play" aria-hidden="true">
          <svg width="20" height="22" viewBox="0 0 20 22" fill="currentColor"><path d="M0 0l20 11L0 22z"/></svg>
        </span>
      </div>
    </section>

    <!-- Selected work -->
    <section class="section" id="work">
      <div class="section-head">
        <h2 data-lines>Selected Work <sup class="count mono" data-work-count></sup></h2>
        <p class="section-head__aside mono muted">(2024 — 2026)</p>
      </div>
      <ul class="work-list" data-work-list></ul>
      <div style="padding-top:40px" data-fade>
        <a class="pill" href="work.html">Tous les projets
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M1 9h15M10 3l6 6-6 6" stroke="currentColor" stroke-width="1.4"/></svg>
        </a>
      </div>
    </section>

    <!-- Statement -->
    <section class="statement">
      <p class="statement__label mono muted">(À propos)</p>
      <p class="statement__text" data-words data-statement></p>
      <div class="statement__cta" data-fade><a class="pill" href="about.html">En savoir plus</a></div>
    </section>

    <!-- Services -->
    <section class="section" id="services">
      <div class="section-head">
        <h2 data-lines>Services</h2>
        <p class="section-head__aside mono muted">(Ce que je fais)</p>
      </div>
      <ul class="services" data-services data-stagger></ul>
    </section>

    <!-- Clients -->
    <div class="marquee" aria-label="Clients"><div class="marquee__track"></div></div>
  </main>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
