<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Portfolio</title>
  <meta name="description" content="Tous les projets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="work">
  <main>
    <section class="page-hero">
      <h1 class="page-hero__title" data-hero-title>Work</h1>
      <div class="page-hero__sub">
        <span class="mono muted" data-hero-fade>(<span data-work-count></span> projets)</span>
        <span></span>
        <p data-hero-fade>Une sélection de projets en design de marque, UX/UI, développement web et motion.</p>
      </div>
    </section>

    <section class="section" style="padding-top:60px">
      <div class="work-toolbar">
        <div class="filters" data-filters></div>
        <div class="view-toggle">
          <button class="is-active" data-view="list">Liste</button>
          <button data-view="grid">Grille</button>
        </div>
      </div>
      <ul class="work-list" data-work-list style="margin-top:24px; border-top:1px solid var(--line)"></ul>
      <div class="work-grid" data-work-grid hidden></div>
    </section>
  </main>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
