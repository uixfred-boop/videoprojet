<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f12-unfiltered-template">
      <link rel="stylesheet" href="assets/css/house.css" />
      <style>
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }
        @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        #f12-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f12-eyebrow {
          position: absolute;
          left: 0;
          right: 0;
          top: 120px;
          display: flex;
          justify-content: center;
        }
        #f12-hl {
          top: 205px;
        }
        #f12-hl .line {
          font-size: 96px;
        }
        #f12-phone {
          left: 300px;
          top: 420px;
          width: 480px;
          height: 740px;
          border-radius: 56px;
          padding: 18px;
        }
        #f12-screen {
          position: absolute;
          left: 18px;
          top: 18px;
          width: 444px;
          height: 600px;
          border-radius: 40px;
          overflow: hidden;
          background: #111;
        }
        #f12-feed {
          position: absolute;
          inset: 0;
        }
        #f12-screen video {
          position: absolute;
          left: -78px;
          top: -60px;
          width: 600px;
          height: 1067px;
          object-fit: cover;
        }
        #f12-rec {
          position: absolute;
          left: 36px;
          top: 36px;
          font-size: 22px;
          padding: 6px 14px;
        }
        #f12-rec i {
          display: block;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #fff;
        }
        #f12-toggle-row {
          position: absolute;
          left: 30px;
          right: 30px;
          bottom: 30px;
          height: 80px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-family: "Inter Tight", Arial, sans-serif;
          font-weight: 800;
          font-size: 36px;
          letter-spacing: -0.02em;
          color: #f4f3f1;
        }
        #f12-sw {
          position: relative;
          width: 128px;
          height: 68px;
          border-radius: 34px;
          background: #c00304;
          box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15);
        }
        #f12-knob {
          position: absolute;
          left: 64px;
          top: 6px;
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: #ffffff;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        #f12-state {
          position: relative;
          margin-left: auto;
          margin-right: 20px;
          width: 64px;
          height: 40px;
          color: #8e8c8a;
          font-size: 30px;
        }
        #f12-state span {
          position: absolute;
          right: 0;
          top: 0;
        }
      </style>

      <div id="f12-root" data-composition-id="f12-unfiltered" data-width="1080" data-height="1920">
        <div class="hf-bg dark">
          <div class="hf-grid" id="f12-grid" data-layout-allow-overflow></div>
          <div class="hf-glow" id="f12-glow" data-layout-allow-overflow></div>
          <div class="hf-vignette"></div>
        </div>

        <div id="f12-eyebrow"><span class="pill" id="f12-pill">Starting today</span></div>
        <div class="hl" id="f12-hl">
          <div class="line">
            <span class="w" id="f12-w1">Everything,</span><span class="w it" id="f12-w2">Unfiltered</span>
          </div>
        </div>

        <div class="card" id="f12-phone">
          <div id="f12-screen">
            <div id="f12-feed">
              <video
                id="f12-v"
                class="clip"
                src="assets/video/broll.mp4"
                data-start="0"
                data-duration="3.8"
                data-media-start="9"
                data-track-index="0"
                muted
                playsinline
              ></video>
            </div>
            <span class="pill red" id="f12-rec"><i></i>REC</span>
          </div>
          <div id="f12-toggle-row">
            <span>Filter</span>
            <span id="f12-state"><span id="f12-on">ON</span><span id="f12-off">OFF</span></span>
            <span id="f12-sw"><span id="f12-knob"></span></span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 54.72;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          const D = 58.52 - T0;

          tl.fromTo("#f12-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.15, opacity: 1, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f12-grid", { y: 0 }, { y: 40, duration: D, ease: "none" }, 0);

          tl.fromTo("#f12-pill", { opacity: 0, y: -16, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, at(54.95));
          tl.fromTo("#f12-w1", { opacity: 0, y: 28, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, at(56.7));
          tl.fromTo("#f12-w2", { opacity: 0, scale: 0.6, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.8)" }, at(57.66));

          // the phone comes up "filtered": soft, over-processed; REC on "coming back"
          tl.fromTo("#f12-phone", { opacity: 0, y: 120, rotation: -4, filter: "blur(16px)" }, { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, at(54.75));
          tl.fromTo("#f12-feed", { filter: "blur(9px) saturate(1.7) brightness(1.25) contrast(0.85)" }, { filter: "blur(9px) saturate(1.7) brightness(1.25) contrast(0.85)", duration: 0.01 }, 0);
          tl.fromTo("#f12-rec", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, at(55.74));
          tl.to("#f12-rec", { opacity: 0.55, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, at(56.1));
          tl.to("#f12-phone", { y: -14, duration: 1.8, ease: "sine.inOut" }, at(55.4));

          // "unfiltered": switch flips off, the image goes raw and sharp
          tl.to("#f12-knob", { x: -58, duration: 0.22, ease: "power3.inOut" }, at(57.68));
          tl.to("#f12-sw", { backgroundColor: "#3a393a", duration: 0.22, ease: "power1.out" }, at(57.68));
          tl.fromTo("#f12-off", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, at(57.74));
          tl.fromTo("#f12-on", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, at(57.74));
          tl.to("#f12-feed", { filter: "blur(0px) saturate(1) brightness(1) contrast(1)", duration: 0.35, ease: "power2.out" }, at(57.72));
          tl.fromTo("#f12-phone", { scale: 1 }, { scale: 1.05, duration: 0.18, ease: "power2.out" }, at(57.7));
          tl.to("#f12-phone", { scale: 1.02, duration: 0.4, ease: "power2.out" }, at(57.9));

          window.__timelines["f12-unfiltered"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
