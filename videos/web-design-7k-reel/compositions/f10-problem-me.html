<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f10-problem-me-template">
      <link rel="stylesheet" href="assets/css/house.css" />
      <style>
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }
        @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        #f10-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f10-hlb .line.big {
          font-size: 104px;
        }
        .f10-tag {
          position: absolute;
          padding: 24px 36px;
          border-radius: 22px;
          background: linear-gradient(180deg, #2a292a, #171717);
          box-shadow: 0 26px 60px rgba(0, 0, 0, 0.28);
          font-family: "Inter Tight", Arial, sans-serif;
          font-weight: 800;
          font-size: 48px;
          letter-spacing: -0.03em;
          color: #f4f3f1;
          white-space: nowrap;
        }
        .f10-tag .strike {
          position: absolute;
          left: 22px;
          right: 22px;
          top: 50%;
          height: 8px;
          margin-top: -4px;
          border-radius: 4px;
          background: #e3191f;
          box-shadow: 0 0 14px rgba(227, 25, 31, 0.6);
          transform-origin: 0% 50%;
        }
        #f10-t1 {
          left: 90px;
          top: 492px;
        }
        #f10-t2 {
          left: 640px;
          top: 470px;
        }
        #f10-t3 {
          left: 130px;
          top: 790px;
        }
        #f10-t4 {
          left: 560px;
          top: 830px;
        }
        #f10-portrait {
          position: absolute;
          left: 330px;
          top: 470px;
          width: 420px;
          height: 420px;
          border-radius: 50%;
          overflow: hidden;
          background: #222;
          box-shadow: 0 34px 80px rgba(0, 0, 0, 0.3);
        }
        #f10-portrait video {
          position: absolute;
          left: -190px;
          top: -150px;
          width: 800px;
          height: 1422px;
          object-fit: cover;
        }
        #f10-ring {
          position: absolute;
          left: 312px;
          top: 452px;
          width: 456px;
          height: 456px;
          border-radius: 50%;
          border: 9px solid #c00304;
          box-shadow:
            0 0 40px rgba(227, 25, 31, 0.45),
            inset 0 0 30px rgba(227, 25, 31, 0.3);
        }
        #f10-me {
          position: absolute;
          left: 0;
          right: 0;
          top: 930px;
          display: flex;
          justify-content: center;
          font-family: "Instrument Serif", Georgia, serif;
          font-style: italic;
          font-size: 150px;
          line-height: 1;
          color: #c00304;
        }
      </style>

      <div id="f10-root" data-composition-id="f10-problem-me" data-width="1080" data-height="1920">
        <div class="hf-bg light">
          <div class="hf-grid" id="f10-grid" data-layout-allow-overflow></div>
          <div class="hf-glow" id="f10-glow" data-layout-allow-overflow></div>
          <div class="hf-vignette"></div>
        </div>

        <div class="hl dk" id="f10-hla">
          <div class="line">
            <span class="w" id="f10-a1">Stop</span><span class="w" id="f10-a2">Looking</span><span class="w" id="f10-a3">For</span>
          </div>
          <div class="line">
            <span class="w" id="f10-a4">The</span><span class="w" id="f10-a5">Fault</span><span class="w it" id="f10-a6">Elsewhere</span>
          </div>
        </div>
        <div class="hl dk" id="f10-hlb" data-layout-allow-overlap>
          <div class="line big">
            <span class="w" id="f10-b1">The</span><span class="w" id="f10-b2">Problem</span>
          </div>
          <div class="line big">
            <span class="w" id="f10-b3">Was</span><span class="w it" id="f10-b4">Me</span>
          </div>
        </div>

        <div class="f10-tag" id="f10-t1">The algorithm<span class="strike" id="f10-s1"></span></div>
        <div class="f10-tag" id="f10-t2">Clients<span class="strike" id="f10-s2"></span></div>
        <div class="f10-tag" id="f10-t3">The market<span class="strike" id="f10-s3"></span></div>
        <div class="f10-tag" id="f10-t4">Bad timing<span class="strike" id="f10-s4"></span></div>

        <div id="f10-portrait" data-layout-allow-overflow>
          <video
            id="f10-v"
            class="clip"
            src="assets/video/broll.mp4"
            data-start="2.5"
            data-duration="2.16"
            data-media-start="14"
            data-track-index="0"
            muted
            playsinline
          ></video>
        </div>
        <div id="f10-ring"></div>
        <div id="f10-me"><span id="f10-me-t">Me.</span></div>
      </div>

      <script>
        (function () {
          const T0 = 42.44;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          const D = 47.1 - T0;

          tl.fromTo("#f10-glow", { scale: 0.8, opacity: 0.4 }, { scale: 1.15, opacity: 1, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f10-grid", { y: 0 }, { y: 40, duration: D, ease: "none" }, 0);

          // phase A headline on the voice
          const a = [["#f10-a1", 43.0], ["#f10-a2", 43.41], ["#f10-a3", 43.78], ["#f10-a4", 43.93], ["#f10-a5", 44.03], ["#f10-a6", 44.36]];
          a.forEach(([id, t]) => {
            tl.fromTo(id, { opacity: 0, y: 26, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, at(t - 0.04));
          });

          // blame tags land around the frame...
          const tags = [["#f10-t1", 42.55, -5], ["#f10-t2", 42.75, 4], ["#f10-t3", 42.95, 3], ["#f10-t4", 43.15, -4]];
          tags.forEach(([id, t, r]) => {
            tl.fromTo(id, { opacity: 0, scale: 0.5, rotation: r * 3 }, { opacity: 1, scale: 1, rotation: r, duration: 0.4, ease: "back.out(2)" }, at(t));
          });
          // ...and get struck through on "the fault elsewhere"
          [["#f10-s1", 44.02], ["#f10-s2", 44.17], ["#f10-s3", 44.32], ["#f10-s4", 44.47]].forEach(([id, t]) => {
            tl.fromTo(id, { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, at(t));
          });
          tl.to(["#f10-t1", "#f10-t2", "#f10-t3", "#f10-t4"], { opacity: 0.55, duration: 0.3, ease: "power1.out" }, at(44.6));

          // "The problem": swap headlines, tags blow outward, the creator lands centre
          tl.to("#f10-hla", { opacity: 0, filter: "blur(14px)", y: -20, duration: 0.25, ease: "power2.in" }, at(44.98));
          tl.fromTo("#f10-b1", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at(45.08));
          tl.fromTo("#f10-b2", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at(45.15));
          tl.fromTo("#f10-b3", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at(46.28));
          tl.fromTo("#f10-b4", { opacity: 0, scale: 0.5, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(2.2)" }, at(46.62));
          [["#f10-t1", -420, -80], ["#f10-t2", 420, -80], ["#f10-t3", -420, 80], ["#f10-t4", 420, 80]].forEach(([id, x, y]) => {
            tl.to(id, { x: x, y: y, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, at(45.0));
          });
          tl.fromTo("#f10-portrait", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, at(45.12));
          tl.fromTo("#f10-ring", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, at(46.28));
          tl.fromTo("#f10-me-t", { opacity: 0, y: 30, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, at(46.62));
          tl.to("#f10-portrait", { scale: 1.04, duration: 1.4, ease: "sine.inOut" }, at(45.7));
          tl.to("#f10-ring", { scale: 1.06, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, at(46.65));

          window.__timelines["f10-problem-me"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
