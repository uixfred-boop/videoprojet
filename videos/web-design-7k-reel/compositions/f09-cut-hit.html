<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f09-cut-hit-template">
      <style>
        #f09-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #030303;
        }
        #f09-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 26%;
        }
        #f09-cam video {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          object-fit: cover;
        }
        #f09-shade {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 80% 60% at 50% 30%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.55) 100%),
            linear-gradient(180deg, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 100%);
        }
        #f09-flash {
          position: absolute;
          inset: 0;
          background: #ffffff;
          opacity: 0;
        }
        #f09-redline {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          box-shadow: inset 0 0 0 0 rgba(227, 25, 31, 0);
        }
      </style>
      <div id="f09-root" data-composition-id="f09-cut-hit" data-width="1080" data-height="1920">
        <div id="f09-cam">
          <video
            id="f09-v"
            class="clip"
            src="assets/video/broll.mp4"
            data-start="0"
            data-duration="1.78"
            data-media-start="0.15"
            data-track-index="0"
            muted
            playsinline
          ></video>
        </div>
        <div id="f09-shade"></div>
        <div id="f09-redline"></div>
        <div id="f09-flash"></div>
      </div>
      <script>
        (function () {
          const T0 = 40.66;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          // the footage's own snap zoom carries the build; we push with it
          tl.fromTo("#f09-cam", { scale: 1.12 }, { scale: 1.24, duration: 1.1, ease: "power2.in" }, 0);
          // "hit": white flash, punch, camera shake, red edge
          tl.fromTo("#f09-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.05, ease: "none" }, at(41.8));
          tl.to("#f09-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, at(41.85));
          tl.to("#f09-cam", { scale: 1.36, duration: 0.08, ease: "power4.out" }, at(41.8));
          tl.to("#f09-cam", { scale: 1.3, duration: 0.5, ease: "power2.out" }, at(41.88));
          const shake = [[18, -12], [-16, 10], [12, 8], [-9, -7], [6, 5], [-3, -2], [0, 0]];
          shake.forEach(([x, y], i) => tl.to("#f09-cam", { x: x, y: y, duration: 0.045, ease: "none" }, at(41.8 + i * 0.045)));
          tl.fromTo("#f09-redline", { boxShadow: "inset 0 0 0 0 rgba(227,25,31,0)" }, { boxShadow: "inset 0 0 140px 10px rgba(227,25,31,0.35)", duration: 0.08, ease: "none" }, at(41.8));
          tl.to("#f09-redline", { boxShadow: "inset 0 0 120px 0 rgba(227,25,31,0.1)", duration: 0.5, ease: "power2.out" }, at(41.9));
          window.__timelines["f09-cut-hit"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
