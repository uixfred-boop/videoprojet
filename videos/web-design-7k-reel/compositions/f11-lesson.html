      <script>
        (function () {
          const T0 = 47.1;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          const D = 54.72 - T0;

          tl.fromTo("#f11-glow", { scale: 0.85, opacity: 0.5, x: 0 }, { scale: 1.1, opacity: 1, x: -120, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f11-grid", { x: 0 }, { x: 40, duration: D, ease: "none" }, 0);

          tl.fromTo("#f11-pill", { opacity: 0, y: -16, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, at(47.66));
          const words = [["#f11-w1", 49.31], ["#f11-w2", 49.85], ["#f11-w3", 50.13], ["#f11-w4", 50.4], ["#f11-w5", 51.0]];
          words.forEach(([id, t]) => {
            tl.fromTo(id, { opacity: 0, y: 28, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at(t - 0.04));
          });

          // the "pretty" site builds while the thought lands
          tl.fromTo("#f11-web", { opacity: 0, y: 90, rotationX: 18, scale: 0.92, filter: "blur(16px)", transformPerspective: 1400 }, { opacity: 1, y: 0, rotationX: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, at(47.15));
          tl.fromTo(["#f11-blob1", "#f11-blob2"], { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out", stagger: 0.12 }, at(47.5));
          ["#f11-h1", "#f11-h2", "#f11-p1", "#f11-p2", "#f11-btn", "#f11-l1", "#f11-l2", "#f11-l3", "#f11-l4"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at(47.7 + i * 0.09));
          });
          tl.to("#f11-blob1", { x: -30, y: 20, scale: 1.1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, at(48.6));

          // "aesthetics": the pretty tag... which isn't enough
          tl.fromTo("#f11-aes", { opacity: 0, scale: 0.4, rotation: -10 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.4, ease: "back.out(2.2)" }, at(51.0));
          tl.fromTo("#f11-aes-s", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out" }, at(51.9));
          tl.to("#f11-aes", { opacity: 0.45, y: 18, duration: 0.3, ease: "power1.out" }, at(52.1));

          // "effective": the page is re-read as offer / proof / CTA
          tl.fromTo("#f11-eff", { opacity: 0, scale: 0.4, rotation: 8 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.42, ease: "back.out(2.4)" }, at(52.48));
          [["#f11-x1", 52.55], ["#f11-x3", 52.72], ["#f11-x2", 52.89]].forEach(([id, t]) => {
            tl.fromTo(id, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, at(t));
          });
          tl.to(["#f11-blob1", "#f11-blob2"], { opacity: 0.25, duration: 0.4, ease: "power1.out" }, at(52.6));

          // "for a specific profile": the client card slides in and gets locked on
          tl.fromTo("#f11-persona", { opacity: 0, x: 260, filter: "blur(14px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, at(53.28));
          const corners = [["#f11-k1", -60, -60], ["#f11-k2", 60, -60], ["#f11-k3", -60, 60], ["#f11-k4", 60, 60]];
          corners.forEach(([id, x, y]) => {
            tl.fromTo(id, { opacity: 0, x: x, y: y }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "power4.out" }, at(53.9));
          });
          tl.to(["#f11-k1", "#f11-k2", "#f11-k3", "#f11-k4"], { scale: 1.15, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, at(54.15));
          tl.fromTo("#f11-lock", { opacity: 0, y: -10, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, at(54.15));

          window.__timelines["f11-lesson"] = tl;
        })();
      </script>
