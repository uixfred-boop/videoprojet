<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f07-cut-questioned-template">
      <style>
        #f07-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #030303;
        }
        #f07-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 30%;
        }
        #f07-cam video {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          object-fit: cover;
        }
        #f07-shade {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 75% 55% at 50% 32%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.62) 100%),
            linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.5) 100%);
        }
      </style>
      <div id="f07-root" data-composition-id="f07-cut-questioned" data-width="1080" data-height="1920">
        <div id="f07-cam">
          <video
            id="f07-v"
            class="clip"
            src="assets/video/broll.mp4"
            data-start="0"
            data-duration="2.88"
            data-media-start="2.45"
            data-track-index="0"
            muted
            playsinline
          ></video>
        </div>
        <div id="f07-shade"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // slow, heavy push on the thinking pose
          tl.fromTo("#f07-cam", { scale: 1.2, filter: "blur(8px) brightness(0.6)" }, { scale: 1.26, filter: "blur(0px) brightness(1)", duration: 0.45, ease: "power2.out" }, 0);
          tl.to("#f07-cam", { scale: 1.42, y: 30, duration: 2.4, ease: "sine.inOut" }, 0.45);
          tl.fromTo("#f07-shade", { opacity: 0.7 }, { opacity: 1, duration: 2.88, ease: "none" }, 0);
          window.__timelines["f07-cut-questioned"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
