<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f04-figured-out-template">
      <link rel="stylesheet" href="assets/css/house.css" />
      <style>
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }
        @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        #f04-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f04-eyebrow {
          position: absolute;
          left: 0;
          right: 0;
          top: 120px;
          display: flex;
          justify-content: center;
        }
        #f04-hl {
          top: 200px;
        }
        #f04-card {
          left: 150px;
          top: 470px;
          width: 780px;
          height: 640px;
        }
        #f04-card .title {
          position: absolute;
          left: 48px;
          top: 40px;
          font-weight: 800;
          font-size: 44px;
          letter-spacing: -0.03em;
        }
        #f04-card .sub {
          position: absolute;
          right: 48px;
          top: 48px;
        }
        .f04-row {
          position: absolute;
          left: 48px;
          right: 48px;
          height: 108px;
          border-radius: 18px;
          background: rgba(255, 255, 255, 0.05);
          border: 2px solid rgba(255, 255, 255, 0.08);
          display: flex;
          align-items: center;
          gap: 28px;
          padding-left: 28px;
        }
        .f04-row .box {
          position: relative;
          flex: none;
          width: 56px;
          height: 56px;
          border-radius: 14px;
          border: 3px solid rgba(255, 255, 255, 0.35);
        }
        .f04-row .fill {
          position: absolute;
          inset: -3px;
          border-radius: 14px;
          background: #27c964;
          box-shadow: 0 0 26px rgba(39, 201, 100, 0.55);
        }
        .f04-row svg {
          position: absolute;
          left: 8px;
          top: 9px;
          width: 40px;
          height: 40px;
          overflow: visible;
        }
        .f04-row .txt {
          font-weight: 800;
          font-size: 48px;
          letter-spacing: -0.03em;
        }
        #f04-r1 {
          top: 140px;
        }
        #f04-r2 {
          top: 268px;
        }
        #f04-r3 {
          top: 396px;
        }
        #f04-meter {
          position: absolute;
          left: 48px;
          right: 48px;
          bottom: 48px;
          height: 22px;
          border-radius: 11px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
        }
        #f04-meter-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          border-radius: 11px;
          background: linear-gradient(90deg, #1f9e4f, #27c964);
          transform-origin: 0% 50%;
        }
        #f04-pct {
          position: absolute;
          right: 48px;
          bottom: 84px;
          font-weight: 800;
          font-size: 34px;
          color: #7ff0a9;
          font-variant-numeric: tabular-nums;
        }
      </style>

      <div id="f04-root" data-composition-id="f04-figured-out" data-width="1080" data-height="1920">
        <div class="hf-bg dark">
          <div class="hf-grid" id="f04-grid" data-layout-allow-overflow></div>
          <div class="hf-glow" id="f04-glow" data-layout-allow-overflow></div>
          <div class="hf-vignette"></div>
        </div>

        <div id="f04-eyebrow"><span class="pill" id="f04-pill">Before that...</span></div>
        <div class="hl" id="f04-hl">
          <div class="line">
            <span class="w" id="f04-w1">I</span><span class="w" id="f04-w2">Thought</span><span class="w" id="f04-w3">I</span
            ><span class="w" id="f04-w4">Had</span><span class="w" id="f04-w5">It</span>
          </div>
          <div class="line">
            <span class="w it" id="f04-w6">All</span><span class="w" id="f04-w7">Figured</span><span class="w" id="f04-w8">Out</span>
          </div>
        </div>

        <div class="card" id="f04-card">
          <span class="title">The Plan</span>
          <span class="label sub">3 / 3</span>
          <div class="f04-row" id="f04-r1">
            <span class="box"><span class="fill" id="f04-f1"></span><svg viewBox="0 0 40 40"><path id="f04-k1" d="M6 21 L16 31 L34 9" fill="none" stroke="#04150a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></svg></span>
            <span class="txt">Portfolio</span>
          </div>
          <div class="f04-row" id="f04-r2">
            <span class="box"><span class="fill" id="f04-f2"></span><svg viewBox="0 0 40 40"><path id="f04-k2" d="M6 21 L16 31 L34 9" fill="none" stroke="#04150a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></svg></span>
            <span class="txt">Skills</span>
          </div>
          <div class="f04-row" id="f04-r3">
            <span class="box"><span class="fill" id="f04-f3"></span><svg viewBox="0 0 40 40"><path id="f04-k3" d="M6 21 L16 31 L34 9" fill="none" stroke="#04150a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></svg></span>
            <span class="txt">Audience</span>
          </div>
          <span id="f04-pct">0%</span>
          <div id="f04-meter"><div id="f04-meter-fill"></div></div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 14.68;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          const D = 18.5 - T0;
          const pct = document.getElementById("f04-pct");

          tl.fromTo("#f04-glow", { scale: 0.85, opacity: 0.5 }, { scale: 1.05, opacity: 0.9, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f04-grid", { x: 0 }, { x: 40, duration: D, ease: "none" }, 0);

          tl.fromTo("#f04-pill", { opacity: 0, y: -20, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, at(14.8));
          const words = [["#f04-w1", 16.15], ["#f04-w2", 16.3], ["#f04-w3", 16.7], ["#f04-w4", 16.81], ["#f04-w5", 17.09], ["#f04-w6", 17.36], ["#f04-w7", 17.57], ["#f04-w8", 18.02]];
          words.forEach(([id, t]) => {
            tl.fromTo(id, { opacity: 0, y: 28, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at(t - 0.04));
          });

          // card + rows blur in; rows stay dim until ticked
          tl.fromTo("#f04-card", { opacity: 0, y: 80, scale: 0.94, filter: "blur(18px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, at(14.75));
          ["#f04-r1", "#f04-r2", "#f04-r3"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -40 }, { opacity: 0.45, x: 0, duration: 0.4, ease: "power3.out" }, at(15.0 + i * 0.12));
          });

          // ticks on "thought" / "all" / "out"
          const ticks = [[1, 16.3], [2, 17.36], [3, 18.02]];
          const meter = { v: 0 };
          ticks.forEach(([n, t]) => {
            tl.to("#f04-r" + n, { opacity: 1, scale: 1.03, duration: 0.18, ease: "power2.out" }, at(t));
            tl.to("#f04-r" + n, { scale: 1, duration: 0.3, ease: "power2.out" }, at(t + 0.18));
            tl.fromTo("#f04-f" + n, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.6)" }, at(t));
            tl.fromTo("#f04-k" + n, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, at(t + 0.08));
          });
          tl.fromTo("#f04-meter-fill", { scaleX: 0 }, { scaleX: 0.333, duration: 0.3, ease: "power2.out" }, at(16.3));
          tl.to("#f04-meter-fill", { scaleX: 0.666, duration: 0.3, ease: "power2.out" }, at(17.36));
          tl.to("#f04-meter-fill", { scaleX: 1, duration: 0.3, ease: "power2.out" }, at(18.02));
          tl.fromTo(meter, { v: 0 }, { v: 33, duration: 0.3, ease: "power2.out", onUpdate: () => (pct.textContent = Math.round(meter.v) + "%") }, at(16.3));
          tl.to(meter, { v: 66, duration: 0.3, ease: "power2.out", onUpdate: () => (pct.textContent = Math.round(meter.v) + "%") }, at(17.36));
          tl.to(meter, { v: 100, duration: 0.3, ease: "power2.out", onUpdate: () => (pct.textContent = Math.round(meter.v) + "%") }, at(18.02));
          tl.to("#f04-card", { y: -12, duration: D - 1, ease: "sine.inOut" }, 0.8);

          window.__timelines["f04-figured-out"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
