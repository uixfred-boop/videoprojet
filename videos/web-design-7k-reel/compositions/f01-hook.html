<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f01-hook-template">
      <link rel="stylesheet" href="assets/css/house.css" />
      <style>
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }
        @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        #f01-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f01-hl .line.l1 {
          font-size: 96px;
        }
        #f01-rev {
          left: 150px;
          top: 470px;
          width: 780px;
          height: 560px;
        }
        #f01-rev .head {
          position: absolute;
          left: 44px;
          top: 38px;
          right: 44px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        #f01-num {
          position: absolute;
          left: 44px;
          top: 92px;
          font-family: "Inter Tight", Arial, sans-serif;
          font-weight: 800;
          font-size: 128px;
          letter-spacing: -0.045em;
          font-variant-numeric: tabular-nums;
          color: #f4f3f1;
        }
        #f01-chart {
          position: absolute;
          left: 44px;
          top: 250px;
          width: 692px;
          height: 200px;
          overflow: visible;
        }
        #f01-dot {
          position: absolute;
          left: 718px;
          top: 248px;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          background: #ff2a2f;
          box-shadow:
            0 0 0 8px rgba(227, 25, 31, 0.25),
            0 0 34px rgba(227, 25, 31, 0.9);
        }
        #f01-axis {
          position: absolute;
          left: 44px;
          right: 44px;
          bottom: 34px;
          display: flex;
          justify-content: space-between;
        }
        .gdot {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #27c964;
          box-shadow: 0 0 10px rgba(39, 201, 100, 0.8);
        }
        #f01-axis .pill {
          font-size: 24px;
          padding: 8px 20px;
          color: #cfcdcb;
        }
        /* Browser mockup: "a single web design project" */
        #f01-web {
          left: 380px;
          top: 820px;
          width: 620px;
          height: 380px;
        }
        #f01-web .bar {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 54px;
          background: rgba(255, 255, 255, 0.06);
          border-bottom: 2px solid rgba(255, 255, 255, 0.08);
          display: flex;
          align-items: center;
          gap: 10px;
          padding-left: 22px;
        }
        #f01-web .dotc {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.25);
        }
        #f01-web .url {
          margin-left: 18px;
          width: 300px;
          height: 28px;
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.08);
        }
        #f01-web .blk {
          position: absolute;
          border-radius: 10px;
        }
        #f01-badge {
          position: absolute;
          left: 760px;
          top: 790px;
          font-size: 30px;
          padding: 10px 24px;
        }
      </style>

      <div id="f01-root" data-composition-id="f01-hook" data-width="1080" data-height="1920">
        <div class="hf-bg dark">
          <div class="hf-grid" id="f01-grid" data-layout-allow-overflow></div>
          <div class="hf-glow" id="f01-glow" data-layout-allow-overflow></div>
          <div class="hf-vignette"></div>
        </div>

        <div class="hl" id="f01-hl">
          <div class="line l1">
            <span class="w" id="f01-w1">I</span><span class="w" id="f01-w2">Made</span
            ><span class="w it" id="f01-w3">$7,000</span>
          </div>
          <div class="line">
            <span class="bar" id="f01-bar">On A Single Web Design Project</span>
          </div>
        </div>

        <div class="card" id="f01-rev">
          <div class="head">
            <span class="label">Revenue</span>
            <span class="pill green" id="f01-paid"><i class="gdot"></i>Paid</span>
          </div>
          <div id="f01-num">$0</div>
          <svg id="f01-chart" viewBox="0 0 692 200">
            <defs>
              <linearGradient id="f01-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e3191f" stop-opacity="0.35" />
                <stop offset="100%" stop-color="#e3191f" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path
              id="f01-area"
              d="M0 192 C 90 188, 150 178, 220 160 S 360 120, 430 104 S 560 40, 692 16 L 692 200 L 0 200 Z"
              fill="url(#f01-fill)"
            />
            <path
              id="f01-line"
              d="M0 192 C 90 188, 150 178, 220 160 S 360 120, 430 104 S 560 40, 692 16"
              fill="none"
              stroke="#e3191f"
              stroke-width="7"
              stroke-linecap="round"
              pathLength="1"
              stroke-dasharray="1"
              stroke-dashoffset="1"
            />
          </svg>
          <div id="f01-dot"></div>
          <div id="f01-axis">
            <span class="pill">Brief</span><span class="pill">Design</span><span class="pill">Launch</span>
          </div>
        </div>

        <div class="card" id="f01-web">
          <div class="bar">
            <span class="dotc"></span><span class="dotc"></span><span class="dotc"></span><span class="url"></span>
          </div>
          <div class="blk" id="f01-b1" style="left: 34px; top: 92px; width: 330px; height: 34px; background: rgba(255,255,255,0.85)"></div>
          <div class="blk" id="f01-b2" style="left: 34px; top: 140px; width: 250px; height: 34px; background: rgba(255,255,255,0.85)"></div>
          <div class="blk" id="f01-b3" style="left: 34px; top: 196px; width: 300px; height: 16px; background: rgba(255,255,255,0.25)"></div>
          <div class="blk" id="f01-b4" style="left: 34px; top: 222px; width: 240px; height: 16px; background: rgba(255,255,255,0.25)"></div>
          <div class="blk" id="f01-b5" style="left: 34px; top: 268px; width: 170px; height: 56px; border-radius: 28px; background: #c00304"></div>
          <div class="blk" id="f01-b6" style="left: 392px; top: 92px; width: 196px; height: 232px; background: linear-gradient(160deg, #3a3a3a, #1d1d1d); border: 2px solid rgba(255,255,255,0.1)"></div>
        </div>
        <span class="pill red" id="f01-badge">1 project</span>
      </div>

      <script>
        (function () {
          const T0 = 0;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          const num = document.getElementById("f01-num");
          const fmt = (v) => "$" + Math.round(v).toLocaleString("en-US");

          // ambient: glow breathes, grid drifts
          tl.fromTo("#f01-glow", { scale: 0.85, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 2.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          tl.fromTo("#f01-grid", { y: 0 }, { y: 40, duration: 5.86, ease: "none" }, 0);

          // headline line 1, word by word on the voice
          tl.fromTo("#f01-w1", { opacity: 0, y: 30, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, at(0.2));
          tl.fromTo("#f01-w2", { opacity: 0, y: 30, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, at(0.3));
          tl.fromTo("#f01-w3", { opacity: 0, scale: 0.6, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.8)" }, at(1.28));
          // red bar wipes in on "on a single web design project"
          tl.fromTo("#f01-bar", { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, at(3.26));

          // revenue card blurs in, counts $0 -> $7,000 while the line draws
          tl.fromTo("#f01-rev", { opacity: 0, y: 70, scale: 0.92, filter: "blur(18px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, at(0.45));
          tl.fromTo("#f01-paid", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(2.9));
          const proxy = { v: 0 };
          tl.fromTo(
            proxy,
            { v: 0 },
            { v: 7000, duration: 1.5, ease: "power2.out", onUpdate: () => (num.textContent = fmt(proxy.v)) },
            at(1.3),
          );
          tl.fromTo("#f01-num", { scale: 0.9, transformOrigin: "0% 50%" }, { scale: 1.06, duration: 1.5, ease: "power2.out" }, at(1.3));
          tl.to("#f01-num", { scale: 1, duration: 0.3, ease: "back.out(2)" }, at(2.8));
          tl.fromTo("#f01-line", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, at(1.3));
          tl.fromTo("#f01-area", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, at(1.6));
          tl.fromTo("#f01-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, at(2.78));
          tl.fromTo("#f01-dot", { boxShadow: "0 0 0 8px rgba(227,25,31,0.25), 0 0 34px rgba(227,25,31,0.9)" }, { boxShadow: "0 0 0 22px rgba(227,25,31,0), 0 0 54px rgba(227,25,31,0.6)", duration: 0.9, ease: "sine.out", repeat: 2 }, at(3.1));

          // "a single web design project": revenue card steps back, browser mockup lands over it
          tl.to("#f01-rev", { x: -70, y: -40, scale: 0.86, duration: 0.6, ease: "power3.inOut" }, at(3.3));
          tl.fromTo("#f01-web", { opacity: 0, x: 240, y: 120, rotation: 6, filter: "blur(16px)" }, { opacity: 1, x: 0, y: 0, rotation: -2, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, at(3.86));
          tl.fromTo("#f01-badge", { opacity: 0, scale: 0.3, rotation: -12 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.4, ease: "back.out(2.4)" }, at(4.5));
          ["#f01-b1", "#f01-b2", "#f01-b3", "#f01-b4", "#f01-b5", "#f01-b6"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at(4.58 + i * 0.08));
          });
          tl.to("#f01-web", { y: -10, rotation: -1, duration: 1.4, ease: "sine.inOut" }, at(4.5));

          window.__timelines["f01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
