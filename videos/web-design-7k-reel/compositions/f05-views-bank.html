<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="f05-views-bank-template">
      <link rel="stylesheet" href="assets/css/house.css" />
      <style>
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; }
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }
        @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        #f05-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f05-ig {
          left: 140px;
          top: 440px;
          width: 800px;
          height: 330px;
        }
        #f05-ig .top {
          position: absolute;
          left: 40px;
          top: 34px;
          right: 40px;
          display: flex;
          align-items: center;
          gap: 22px;
        }
        #f05-ig .av {
          width: 86px;
          height: 86px;
          border-radius: 50%;
          padding: 4px;
          background: linear-gradient(135deg, #e3191f, #f2a03d);
        }
        #f05-ig .av img {
          display: block;
          width: 78px;
          height: 78px;
          border-radius: 50%;
          border: 3px solid #1b1b1b;
          object-fit: cover;
        }
        #f05-ig .names {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        #f05-ig .names .blur-bar:first-child {
          width: 210px;
        }
        #f05-ig .names .blur-bar:last-child {
          width: 130px;
          height: 14px;
          opacity: 0.6;
        }
        #f05-ig .ins {
          margin-left: auto;
        }
        #f05-views-l {
          position: absolute;
          left: 40px;
          top: 160px;
        }
        #f05-views {
          position: absolute;
          left: 40px;
          top: 196px;
          font-weight: 900;
          font-size: 88px;
          letter-spacing: -0.045em;
          font-variant-numeric: tabular-nums;
          line-height: 1;
        }
        #f05-spark {
          position: absolute;
          right: 40px;
          top: 170px;
          width: 200px;
          height: 120px;
          overflow: visible;
        }
        #f05-bank {
          left: 140px;
          top: 820px;
          width: 800px;
          height: 330px;
        }
        #f05-bank .top {
          position: absolute;
          left: 40px;
          top: 34px;
          right: 40px;
          display: flex;
          align-items: center;
          gap: 18px;
        }
        #f05-bank .ico {
          width: 64px;
          height: 64px;
          border-radius: 16px;
          background: rgba(255, 255, 255, 0.08);
          border: 2px solid rgba(255, 255, 255, 0.12);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #f05-bank .ttl {
          font-weight: 800;
          font-size: 38px;
          letter-spacing: -0.03em;
        }
        #f05-bal-l {
          position: absolute;
          left: 40px;
          top: 132px;
        }
        #f05-bal {
          position: absolute;
          left: 40px;
          top: 170px;
          font-weight: 900;
          font-size: 116px;
          letter-spacing: -0.045em;
          line-height: 1;
          color: #f4f3f1;
          font-variant-numeric: tabular-nums;
          transform-origin: 0% 60%;
        }
        #f05-flat {
          position: absolute;
          right: 40px;
          top: 176px;
          width: 250px;
          height: 110px;
          overflow: visible;
        }
        #f05-none {
          position: absolute;
          right: 40px;
          top: 40px;
          font-size: 24px;
          padding: 8px 18px;
        }
        #f05-vs {
          position: absolute;
          left: 490px;
          top: 760px;
          width: 100px;
          height: 72px;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2;
          font-family: "Instrument Serif", Georgia, serif;
          font-style: italic;
          font-size: 54px;
          color: #f4f3f1;
          background: #030303;
          border: 2px solid rgba(255, 255, 255, 0.16);
          border-radius: 36px;
        }
      </style>

      <div id="f05-root" data-composition-id="f05-views-bank" data-width="1080" data-height="1920">
        <div class="hf-bg dark">
          <div class="hf-grid" id="f05-grid" data-layout-allow-overflow></div>
          <div class="hf-glow" id="f05-glow" data-layout-allow-overflow></div>
          <div class="hf-vignette"></div>
        </div>

        <div class="hl" id="f05-hl">
          <div class="line">
            <span class="w it" id="f05-w1">Millions</span><span class="w" id="f05-w2">Of Views...</span>
          </div>
          <div class="line">
            <span class="bar" id="f05-bar">$0 In The Bank</span>
          </div>
        </div>

        <div class="card" id="f05-ig">
          <div class="top">
            <span class="av"><img src="assets/img/avatar.jpg" alt="" /></span>
            <span class="names"><span class="blur-bar"></span><span class="blur-bar"></span></span>
            <span class="pill ins">Insights</span>
          </div>
          <span class="label" id="f05-views-l">Views</span>
          <span id="f05-views">0</span>
          <svg id="f05-spark" viewBox="0 0 250 120">
            <path id="f05-sl" d="M0 110 L40 96 L80 100 L120 70 L160 62 L200 30 L250 6" fill="none" stroke="#27c964" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          </svg>
        </div>

        <div id="f05-vs">vs</div>

        <div class="card" id="f05-bank">
          <div class="top">
            <span class="ico">
              <svg width="34" height="34" viewBox="0 0 34 34"><path d="M3 13 L17 4 L31 13 M6 14 V26 M13 14 V26 M21 14 V26 M28 14 V26 M3 30 H31" fill="none" stroke="#f4f3f1" stroke-width="3" stroke-linecap="round" /></svg>
            </span>
            <span class="ttl">Bank Account</span>
          </div>
          <span class="pill red" id="f05-none">No incoming payments</span>
          <span class="label" id="f05-bal-l">Available balance</span>
          <span id="f05-bal">$0.00</span>
          <svg id="f05-flat" viewBox="0 0 250 110">
            <path d="M0 96 H250" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-dasharray="8 10" />
            <path id="f05-fl" d="M0 96 H250" fill="none" stroke="#e3191f" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          </svg>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 18.5;
          const at = (t) => Math.max(0, t - T0);
          const tl = gsap.timeline({ paused: true });
          const D = 24.9 - T0;
          const views = document.getElementById("f05-views");
          const bal = document.getElementById("f05-bal");

          tl.fromTo("#f05-glow", { scale: 0.9, opacity: 0.5, y: 0 }, { scale: 1.1, opacity: 0.9, y: 300, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f05-grid", { y: 0 }, { y: 40, duration: D, ease: "none" }, 0);

          // "Millions of views on Instagram..."
          tl.fromTo("#f05-w1", { opacity: 0, scale: 0.7, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(1.8)" }, at(19.24));
          tl.fromTo("#f05-w2", { opacity: 0, y: 28, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, at(19.86));
          tl.fromTo("#f05-ig", { opacity: 0, y: 90, scale: 0.92, filter: "blur(18px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, at(18.55));
          const v = { n: 0 };
          tl.fromTo(
            v,
            { n: 0 },
            {
              n: 1000000,
              duration: 1.5,
              ease: "power3.out",
              onUpdate: () => (views.textContent = Math.round(v.n).toLocaleString("en-US") + (v.n > 999999 ? "+" : "")),
            },
            at(19.27),
          );
          tl.fromTo("#f05-sl", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" }, at(19.3));
          tl.fromTo("#f05-views", { scale: 0.92, transformOrigin: "0% 60%" }, { scale: 1.04, duration: 1.5, ease: "power3.out" }, at(19.27));
          tl.to("#f05-views", { scale: 1, duration: 0.3, ease: "back.out(2)" }, at(20.8));

          // "...and yet, my bank account still showed zero dollars."
          tl.to("#f05-ig", { opacity: 0.55, scale: 0.97, filter: "blur(2px)", duration: 0.5, ease: "power2.out" }, at(21.35));
          tl.fromTo("#f05-vs", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, at(21.5));
          tl.fromTo("#f05-bank", { opacity: 0, y: 90, scale: 0.92, filter: "blur(18px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, at(22.36));
          tl.fromTo("#f05-bar", { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, at(22.5));
          tl.fromTo("#f05-fl", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power1.inOut" }, at(22.7));
          tl.fromTo("#f05-none", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(23.41));
          // "zero dollars": balance goes red and pulses
          tl.to(bal, { color: "#ff3b3f", duration: 0.12, ease: "none" }, at(24.04));
          tl.fromTo(bal, { scale: 1, textShadow: "0 0 0px rgba(227,25,31,0)" }, { scale: 1.12, textShadow: "0 0 40px rgba(227,25,31,0.9)", duration: 0.16, ease: "power2.out" }, at(24.04));
          tl.to(bal, { scale: 1, textShadow: "0 0 18px rgba(227,25,31,0.5)", duration: 0.5, ease: "elastic.out(1, 0.5)" }, at(24.2));
          [12, -10, 8, -6, 4, 0].forEach((x, i) => tl.to("#f05-bank", { x: x, duration: 0.045, ease: "none" }, at(24.06 + i * 0.045)));
          tl.to("#f05-bank", { boxShadow: "0 0 0 3px rgba(227,25,31,0.6), 0 40px 90px rgba(0,0,0,0.65), 0 0 80px rgba(227,25,31,0.35)", duration: 0.25, ease: "power2.out" }, at(24.04));
          window.__timelines["f05-views-bank"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
