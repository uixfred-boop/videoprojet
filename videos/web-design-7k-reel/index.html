      @font-face {
        font-family: "Inter Tight";

        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Inter Tight";
        src: url("assets/fonts/inter-tight-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #030303;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030303;
      }
      /* Scene slots fill the frame. Cutaways sit above the footage card. */
      #root > .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #root > .scene.cut {
        z-index: 8;
      }
      #root > .captions {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      /* Bottom footage card (ref layout): x 72–1008, top 1408, runs off the bottom edge. */
      #strip {
        position: absolute;
        left: 72px;
        top: 1408px;
        width: 936px;
        height: 620px;
        border-radius: 34px;
        overflow: hidden;
        z-index: 5;
        background: #1a1a1a;
        box-shadow:
          0 -18px 70px rgba(0, 0, 0, 0.5),
          inset 0 0 0 2px rgba(255, 255, 255, 0.1);
      }
      #strip-inner {
        position: absolute;
        inset: 0;
      }
      #strip video {
        position: absolute;
        left: 0;
        top: -265px;
        width: 936px;
        height: 1664px;
        object-fit: cover;
      }
      #strip-edge {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }
      /* Head pop-out: the same footage, background removed, shown only above the card edge. */
      #popout {
        position: absolute;
        left: 72px;
        top: 1143px;
        width: 936px;
        height: 1664px;
        z-index: 6;
        clip-path: inset(0px 0px 1364px 0px);
      }
      #popout video {
        position: absolute;
        left: 0;
        top: 0;
        width: 936px;
        height: 1664px;
        object-fit: cover;
      }

    </style>
