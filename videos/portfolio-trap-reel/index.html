      /* head pop-out: background-removed footage, shown only in the band just above the card edge */
      #popout {
        position: absolute;
        inset: 0;
        z-index: 6;
        clip-path: inset(1236px 0px 482px 0px);
      }
      #popout video {
        position: absolute;
        object-fit: cover;
