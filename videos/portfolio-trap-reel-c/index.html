    <script>
      const tl = gsap.timeline({ paused: true });
      // the card is hidden during cutaways (the cutaway scenes sit above it). The hook is a big face card of its own, so
      // the strip rises in at the first graphic scene, as the face drops to the bottom of the frame
      tl.fromTo("#strip-inner", { scale: 1.08, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 1.28);
      tl.fromTo(["#strip", "#popout"], { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 1.28);
      window.__timelines["main"] = tl;
    </script>
